(function(){
  function bar(t){var d=document.getElementById('fatal');if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#B0352B;color:#fff;padding:10px;font:14px/1.6 sans-serif;direction:rtl';(document.body||document.documentElement).appendChild(d)}d.innerHTML=t+' — <a style="color:#fff;font-weight:bold" href="reset.html">اضغط هنا لإعادة ضبط الملفات المؤقتة</a>'}
  window.addEventListener('error',function(e){bar('حصلت مشكلة في البرنامج: '+(e.message||''))});
  setTimeout(function(){var a=document.getElementById('app');if(!a||!a.innerHTML.trim())bar('البرنامج تأخر في الفتح')},9000);
})();

<style>
:root{
  --bg:#E4E8E7;--paper:#FAFAF8;--ink:#16252D;--mute:#5B6A71;--line:#C8D0D0;--steel:#2C5B7A;--steel-d:#1F4259;
  --pos:#2B7A57;--neg:#B0352B;--flag:#F0C132;--flag-ink:#4a3a00;--tint:#D9E4E8;--input:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191D;--paper:#1A242A;--ink:#E5ECEE;--mute:#93A3AA;--line:#33434B;--steel:#6FA6C6;--steel-d:#9CC5DD;
  --pos:#5CC08F;--neg:#F0877C;--flag:#8A6D0B;--flag-ink:#FFE9A0;--tint:#22323B;--input:#141D22}}
:root[data-theme="dark"]{
  --bg:#12191D;--paper:#1A242A;--ink:#E5ECEE;--mute:#93A3AA;--line:#33434B;--steel:#6FA6C6;--steel-d:#9CC5DD;
  --pos:#5CC08F;--neg:#F0877C;--flag:#8A6D0B;--flag-ink:#FFE9A0;--tint:#22323B;--input:#141D22}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;min-height:100%;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;font-weight:700;margin:0;letter-spacing:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
td.n,th.n{display:table-cell}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}

/* header + nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel-d);color:#F2F7F9;display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem;min-height:56px}
:root[data-theme="dark"] header{background:#0D1418}
header h1{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0}
.brand img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex:none}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin:.2rem 0 .9rem}
.crumb{color:var(--mute);font-size:.82rem}
.ptitle{font-size:1.75rem;line-height:1.25}
.phead .status{color:var(--mute);white-space:nowrap}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;display:flex;gap:.4rem;background:var(--bg);padding:.45rem 0;margin-bottom:.6rem}
.jump button{flex:1;border:1px solid var(--steel);background:var(--paper);color:var(--steel-d);border-radius:6px;padding:.35rem .2rem;font-weight:600;font-size:.88rem}
@media(min-width:900px){.jump{top:calc(env(safe-area-inset-top,0px) + 108px)}}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:.25rem .4rem;max-width:9rem}
header select option{color:#16252D}
.status{font-size:.72rem;opacity:.85;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:.25rem .55rem;font-size:.85rem}
nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;border-top:3px solid transparent;padding:.55rem .1rem .5rem;font-size:.78rem;color:var(--mute);font-weight:500}
nav button[aria-current="true"]{border-top-color:var(--steel);color:var(--ink);font-weight:600;background:var(--tint)}
nav button{font-size:.85rem}
main{max-width:1100px;margin:0 auto;padding:1rem .9rem 6.5rem}
@media(min-width:900px){
  nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);inset-inline:auto;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-inline:calc((100% - 1100px)/2)}
  main{padding-bottom:3rem}
}

/* blocks */
.block{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem;margin-bottom:1rem}
.block h2{font-size:1.05rem;margin-bottom:.5rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.block h3{font-size:.95rem;margin:.9rem 0 .3rem}
.line{display:flex;align-items:baseline;gap:.5rem;padding:.28rem 0}
.line .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px);min-width:1rem}
.line b{font-weight:600}
.line.total{border-top:1.5px solid var(--ink);margin-top:.3rem;padding-top:.45rem;font-size:1.1rem}
.line.total b{font-family:'Reem Kufi',sans-serif;font-size:1.25rem}
.grid2{display:grid;gap:1rem}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.7rem;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.3rem .85rem;font-size:.85rem;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
.btn{border:1px solid var(--steel);background:var(--steel);color:#fff;border-radius:6px;padding:.4rem .9rem;font-weight:500;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--steel)}
.btn.sm{padding:.2rem .6rem;font-size:.8rem}
.btn:disabled{opacity:.5}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
.ribbon{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.2rem .7rem;align-items:center;padding:.5rem 0;border-bottom:1px dotted var(--line)}
.ribbon .lbl{font-weight:600;font-size:.9rem}
.ribbon .bars{display:grid;gap:3px}
.ribbon .bars i{display:block;height:7px;border-radius:2px;min-width:2px}
.ribbon .bars .in{background:var(--pos)}.ribbon .bars .out{background:var(--neg)}
.ribbon .vals{font-size:.78rem;text-align:left;line-height:1.35}
.ribbon.off{opacity:.55}
.ribbon label{grid-column:1/-1;font-size:.75rem;color:var(--mute);display:flex;gap:.35rem;align-items:center}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-.2rem;padding-inline:.2rem}
table.t{border-collapse:collapse;width:100%;min-width:640px}
table.t th{font-size:.78rem;font-weight:600;color:var(--mute);text-align:right;padding:.35rem .3rem;border-bottom:1.5px solid var(--ink);white-space:nowrap}
table.t td{padding:.15rem .2rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tfoot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:600;padding:.4rem .3rem}
table.t td.n,table.t th.n{text-align:left}
table.t td.wide{min-width:14rem}
tr.flagged td{background:color-mix(in srgb,var(--flag) 18%,transparent)}
.cell{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;padding:.28rem .3rem;min-width:0}
.cell:hover{border-color:var(--line)}
.cell:focus{background:var(--input);border-color:var(--steel)}
input[type=number].cell{direction:ltr;text-align:left;min-width:5.2rem}
input[type=date].cell{min-width:8.5rem}
select.cell{padding-inline:.1rem;min-width:5rem;background:var(--paper)}
.x{border:0;background:none;color:var(--mute);font-size:1.2rem;line-height:1;padding:.2rem .45rem;border-radius:4px}
.x:hover{color:var(--neg)}
.x.armed{background:var(--neg);color:#fff;font-size:.78rem;white-space:nowrap}
.flag{display:inline-block;border:0;background:var(--flag);color:var(--flag-ink);border-radius:3px;font-size:.7rem;padding:.02rem .4rem;margin:.1rem .2rem 0 0;font-weight:600}
.empty{color:var(--mute);padding:1rem 0;text-align:center}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.2rem 1rem;margin:.4rem 0 .6rem}
.stat div{border-inline-start:3px solid var(--line);padding:.1rem .6rem}
.stat small{display:block;color:var(--mute);font-size:.75rem}
.stat b{font-size:1.05rem;font-weight:600}
.meter{height:8px;background:var(--tint);border-radius:2px;overflow:hidden;margin:.2rem 0}
.meter i{display:block;height:100%;background:var(--steel)}
.field{display:grid;gap:.2rem;font-size:.8rem;color:var(--mute)}
.field input,.field select{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;color:var(--ink)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:end}
details.codes summary{cursor:pointer;color:var(--steel);font-weight:600}
.toast{position:fixed;inset-inline:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:6px;z-index:40;font-size:.9rem;text-align:center;max-width:30rem;margin-inline:auto}
body.ro .x,body.ro [data-act^="add"]{display:none}
.previewwrap{background:#9aa7ac;padding:.8rem;border-radius:4px;overflow-x:auto}
.previewwrap .paper{max-width:794px;min-width:640px;margin:0 auto;padding:22px 26px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.dim{opacity:.6}
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.lockbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.4rem;width:100%;max-width:24rem;display:grid;gap:.7rem}
.lockbox img{max-width:70%;max-height:9rem;margin:0 auto;background:#fff;padding:6px;border-radius:6px}
.lockbox h2{text-align:center;font-size:1.3rem}

@media print{
  header,nav,.toast,main>.phead,main>.block,.jump{display:none!important}
  html,body{background:#fff!important}
  main{padding:0!important;max-width:none!important;margin:0!important}
  .previewwrap{background:none!important;padding:0!important;overflow:visible!important}
  .previewwrap .paper{box-shadow:none!important;max-width:none!important;min-width:0!important;padding:0!important;margin:0!important}
}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{display:inline-block;cursor:pointer;position:relative}
.rcp{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center;margin-top:.1rem;padding-inline:.3rem}
.rcp .rl{display:inline-flex;align-items:center;gap:.1rem}
.rcp a{font-size:.78rem;color:var(--steel);text-decoration:none;border-bottom:1px dotted var(--steel)}
.rcp .x{font-size:1rem;padding:0 .25rem}
@media(max-width:700px){
  .scroll{overflow-x:visible;margin-inline:0;padding-inline:0}
  table.t,table.t tbody,table.t tfoot{display:block;min-width:0!important;width:100%}
  table.t thead{display:none}
  table.t tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:.15rem .5rem;padding:.6rem 0;border-bottom:1.5px solid var(--line)}
  table.t tbody td{border:0;padding:0;min-width:0}
  table.t tbody td[data-l]::before{content:attr(data-l);display:block;font-size:.68rem;color:var(--mute);padding-inline:.3rem}
  table.t tbody td[data-l=""]::before{display:none}
  table.t tbody td.wide{grid-column:1/-1;min-width:0}
  table.t tbody td[data-l=""],table.t tbody td:last-child:not([data-l]){grid-column:1/-1;justify-self:end}
  table.t tbody td.n{text-align:right;padding-inline:.3rem}
  table.t tbody td.empty{grid-column:1/-1}
  table.t tfoot tr{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;padding:.55rem 0;border-top:1.5px solid var(--ink)}
  table.t tfoot td{border:0!important;padding:0!important}
  table.t tfoot td:empty{display:none}
  .cell{border-color:var(--line);background:var(--input)}
  input[type=number].cell,input[type=date].cell,select.cell{min-width:0}
}
@media(max-width:700px){
  .tblmode .scroll{overflow-x:auto;margin-inline:-.2rem;padding-inline:.2rem}
  .tblmode table.t{display:table!important;min-width:680px!important;width:100%}
  .tblmode table.t thead{display:table-header-group!important}
  .tblmode table.t tbody{display:table-row-group!important}
  .tblmode table.t tfoot{display:table-footer-group!important}
  .tblmode table.t tr{display:table-row!important;padding:0!important;border:0!important}
  .tblmode table.t td,.tblmode table.t th{display:table-cell!important;border-bottom:1px solid var(--line)!important;padding:.15rem .2rem!important}
  .tblmode table.t td::before{display:none!important}
  .tblmode table.t tfoot td{border-top:1.5px solid var(--ink)!important}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

/* report sheet (shared with downloaded file) */
.paper{background:#fff;color:#111;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;font-size:12.5px;line-height:1.55;direction:rtl}
.paper h1{font-family:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:21px;margin:0 0 2px;color:#111}
.paper .meta{color:#555;font-size:11.5px;margin-bottom:10px}
.paper h2{font-family:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:14.5px;margin:16px 0 5px;border-bottom:1.5px solid #17252D;padding-bottom:3px;color:#111;display:block}
.paper table{width:100%;border-collapse:collapse;margin:4px 0 8px;page-break-inside:auto}
.paper tr{page-break-inside:avoid}
.paper th,.paper td{border:1px solid #b9c0c0;padding:3px 6px;text-align:right;vertical-align:top}
.paper th{background:#eaeeee;font-weight:600}
.paper td.n,.paper th.n{text-align:left;direction:ltr;white-space:nowrap}
.paper tfoot td{font-weight:700;background:#f4f6f6}
.paper .neg{color:#b0352b}.paper .pos{color:#2B7A57}
.paper .sum{display:flex;justify-content:space-between;border-bottom:1px dotted #999;padding:2px 0}
.paper .sum.big{border-top:1.5px solid #111;border-bottom:0;font-weight:700;font-size:14px;margin-top:4px;padding-top:4px}
.paper .note{color:#8a5a00;font-size:11px}
.paper table.num td:first-child,.paper table.num th:first-child{width:26px;text-align:center}
.paper tbody tr:nth-child(even) td{background:#f6f8f8}
.paper thead th{border-bottom:2px solid #17252D}
.paper .kpis{display:flex;gap:8px;margin:8px 0 4px}
.paper .kpis div{flex:1;border:1px solid #b9c0c0;border-top:3px solid #17252D;padding:4px 10px}
.paper .kpis small{display:block;color:#555;font-size:11px}
.paper .kpis b{font-size:15px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="logo" alt="" hidden><h1 id="brandname">حسابات المشاريع</h1></div>
  <select id="proj" aria-label="المشروع"></select>
  <button class="iconbtn" id="gear" aria-label="الإعدادات" title="الإعدادات">⚙ إعدادات</button>
</header>
<nav id="nav" aria-label="الأقسام">
  <button data-act="tab" data-t="dash">الرئيسية</button>
  <button data-act="tab" data-t="acc">الحسابات</button>
  <button data-act="tab" data-t="subs">المقاولين</button>
  <button data-act="tab" data-t="boq">BOQ</button>
  <button data-act="tab" data-t="rep">التقارير</button>
</nav>
<main id="app"></main>
<datalist id="cats"></datalist>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const MONTHS_AR={'01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'};
const mLabel=m=>m&&m.length===7?(MONTHS_AR[m.slice(5)]||m)+' '+m.slice(0,4):'—';
const fmt=(n,d=3)=>(n==null||n===''||isNaN(n))?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const N=v=>`<span class="n">${fmt(v)}</span>`;
const NS=v=>`<span class="n ${v<0?'neg':v>0?'pos':''}">${fmt(v)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let uidc=Date.now();const nid=p=>p+(uidc++).toString(36);
const clone=o=>JSON.parse(JSON.stringify(o));
const r3=n=>Math.round(n*1000)/1000;
const eff=x=>x.date||(x.month+'-01');

/* ---------- state ---------- */
function boqPid(){
  if(UI.boqProj)return UI.boqProj;
  if(UI.proj&&UI.proj!=='all'&&UI.proj!=='office')return UI.proj;
  const ks=Object.keys((S.boq&&S.boq.byProject)||{});return ks[0]||'mofleh';
}
function mkBoq(){
  const o={byProject:{},codes:[]};
  Object.defineProperty(o,'divs',{enumerable:false,configurable:true,
    get(){const p=boqPid();return(o.byProject[p]||(o.byProject[p]={divs:[]})).divs},
    set(v){const p=boqPid();(o.byProject[p]||(o.byProject[p]={divs:[]})).divs=v}});

function flush(key){

  chain[key]=(chain[key]||Promise.resolve()).then(async()=>{
    const body=clone(S[key]);const js=JSON.stringify(body);

          lastJSON[k]=js;S[k]=Object.assign(defaults()[k],typeof sanitizeDoc==='function'?sanitizeDoc(k,d):d);if(typeof SERVER!=='undefined'&&SERVER&&typeof sanitizeDoc==='function'&&JSON.stringify(sanitizeDoc(k,d))!==js&&DB&&DB.H){setTimeout(()=>{DB.H.allowOnce.add(k);lastJSON[k]=null;commit(k)},800);setTimeout(()=>{DB.H.allowOnce.delete(k)},8000)}
          const a=document.activeElement;
          if(a&&a.matches&&a.matches('input,select')){dirtyRemote=true}else render();

const projName=id=>(S.settings.projects.find(p=>p.id===id)||{name:id||'—'}).name;

const projOK=(p,f)=>(f||UI.proj)==='all'||(p||'office')===(f||UI.proj);
function L(pf){return{exp:S.ledger.exp.filter(e=>projOK(e.project,pf)),inc:S.ledger.inc.filter(i=>projOK(i.project,pf))}}
function allMonths(){const s=new Set([...S.ledger.exp.map(e=>e.month),...S.ledger.inc.map(i=>i.month)]);return[...s].filter(Boolean).sort()}
function agg(m,pf){const l=L(pf);const e=l.exp.filter(x=>x.month===m),i=l.inc.filter(x=>x.month===m);
  return{inc:sum(i,x=>x.amount),budget:sum(e,x=>x.budget),exp:sum(e,x=>x.actual)}}
function cumulative(upto,pf){let t=0;allMonths().forEach(m=>{if(m<=upto&&!S.settings.excluded.includes(m)){const a=agg(m,pf);t+=a.inc-a.exp}});return t}
const rowDue=r=>(+r.executed||0)-(+r.retention||0)-(+r.deductions||0);
const rowNet=r=>rowDue(r)-(+r.other||0)+(+r.extra||0);
const rowBal=r=>rowNet(r)-(+r.paid||0);
const linkedExp=a=>S.ledger.exp.filter(e=>e.acct===a);
const linkedTot=a=>sum(linkedExp(a),e=>e.actual);
function subTot(s){const r=s.rows;const pm=sum(r,x=>x.paid),pl=linkedTot('c:'+s.id);const net=sum(r,rowNet);
  return{exec:sum(r,x=>x.executed),net,paid:pm+pl,paidManual:pm,paidLinked:pl,bal:net-pm-pl,contract:+s.contract||0}}
const matsTotal=()=>sum(S.subs.mats,m=>m.amount)+linkedTot('m');
const listTotal=l=>sum(l.items,x=>x.amount)+linkedTot('l:'+l.id);
function acctOpts(pid){
  const o=[['','— بدون —']];
  S.subs.subs.filter(s=>s.project===pid).forEach(s=>o.push(['c:'+s.id,'مقاول: '+s.trade]));
  if(pid==='mofleh')o.push(['m','مواد بناء']);

}
function acctName(a){

  if(a.startsWith('c:')){const s=S.subs.subs.find(x=>x.id===a.slice(2));return s?'مقاول: '+s.trade:''}

function setLogo(file){

    c.getContext('2d').drawImage(img,0,0,c.width,c.height);

const KEYOF={list:'subs',litem:'subs',div:'boq',proj:'settings',exp:'ledger',inc:'ledger',rec:'dues',pen:'dues',mat:'subs',sub:'subs',row:'subs',subdel:'subs',boq:'boq',extra:'settings'};
function ref(c,id){
  switch(c){
    case 'exp':return S.ledger.exp.find(x=>x.id===id);
    case 'inc':return S.ledger.inc.find(x=>x.id===id);
    case 'rec':return S.dues.receivables.find(x=>x.id===id);
    case 'pen':return S.dues.pending.find(x=>x.id===id);
    case 'mat':return S.subs.mats.find(x=>x.id===id);
    case 'sub':return S.subs.subs.find(x=>x.id===id);
    case 'row':{const[s,i]=id.split(':');const sb=S.subs.subs.find(x=>x.id===s);return sb&&sb.rows[+i]}
    case 'boq':for(const d of S.boq.divs){const it=d.items.find(x=>x.id===id);if(it)return it}return null;
    case 'extra':return S.settings.extras[+id];
    case 'proj':return S.settings.projects.find(x=>x.id===id);
    case 'list':return S.subs.lists.find(x=>x.id===id);
    case 'litem':for(const l of S.subs.lists){const it=l.items.find(x=>x.id===id);if(it)return it}return null;
  }
}
function afterEdit(c,o,k){
  if(c==='exp'&&k==='project'&&o.acct&&!acctOpts(o.project).some(x=>x[0]===o.acct))o.acct='';
  if((c==='exp'||c==='inc')&&k==='date'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date||''))o.month=o.date.slice(0,7);
  if(c==='inc'&&k==='amount'&&o.amount!=null){o.flags=(o.flags||[]).filter(f=>f!=='pending');o.kind='cash'}
  if(c==='boq'){
    if(k==='qty'||k==='rate'){if(o.qty!=null&&o.rate!=null){o.amount=r3(o.qty*o.rate);o.fixed=false}}
    if(k==='amount'){o.amount=o.amount||0;o.fixed=true}
  }
  if(c==='mat'&&k==='date'){o.flags=(o.flags||[]).filter(f=>f!=='date')}
  if((c==='exp')&&k==='date'){o.flags=(o.flags||[]).filter(f=>f!=='date')}
  if(c==='mat'&&k==='desc'&&false){}
}

function parseSubs(sh){

function applyMonthly(p,mode){
  if(mode==='replace'){
    const em=new Set(p.exp.map(e=>e.month)),im=new Set(p.inc.map(e=>e.month));
    S.ledger.exp=S.ledger.exp.filter(e=>!em.has(e.month)).concat(p.exp);
    S.ledger.inc=S.ledger.inc.filter(e=>!im.has(e.month)).concat(p.inc);
    if(p.pen&&p.pen.length)S.dues.pending=p.pen;if(p.rec&&p.rec.length)S.dues.receivables=p.rec;if(p.sal&&p.sal.rows.length)S.dues.salaries=p.sal;
  }else{
    p.exp.forEach(e=>{if(!S.ledger.exp.some(x=>sameRow(x,e,['month','date','desc','actual'])))S.ledger.exp.push(e)});
    p.inc.forEach(e=>{if(!S.ledger.inc.some(x=>sameRow(x,e,['month','date','desc','amount'])))S.ledger.inc.push(e)});
    (p.pen||[]).forEach(e=>{if(!S.dues.pending.some(x=>sameRow(x,e,['date','party','amount'])))S.dues.pending.push(e)});
    (p.rec||[]).forEach(e=>{if(!S.dues.receivables.some(x=>sameRow(x,e,['date','party','amount'])))S.dues.receivables.push(e)});
    if(p.sal&&!(S.dues.salaries.rows||[]).length)S.dues.salaries=p.sal;
  }
}
function applySubs(p,mode){
  p.subs.forEach(c=>{
    let ex=S.subs.subs.find(x=>[c.tt,c.sheet].filter(Boolean).some(n=>nz(x.trade)===nz(n))||(c.name&&nz(x.name)===nz(c.name)));
    if(!ex){ex={id:nid('s'),trade:c.trade,name:c.name,phone:c.phone,contract:c.contract||0,project:'mofleh',rows:[]};S.subs.subs.push(ex)}
    else{if(c.contract!=null)ex.contract=c.contract;if(c.phone&&!ex.phone)ex.phone=c.phone;if(c.name&&!ex.name)ex.name=c.name}
    if(mode==='replace')ex.rows=c.rows;else c.rows.forEach(r=>{if(!ex.rows.some(x=>sameRow(x,r,['desc','executed'])))ex.rows.push(r)});
  });
  const names=p.subs.map(c=>c.sheet);
  S.settings.extras=S.settings.extras.filter(x=>!names.some(n=>nz(x.label).includes(nz(n))));
  if(p.site){
    let L=S.subs.lists.find(x=>nz(x.name)===nz('تجهيز موقع'));
    if(!L){L={id:nid('l'),name:'تجهيز موقع',project:'mofleh',items:[]};S.subs.lists.push(L)}
    const its=p.site.map(x=>({id:nid('li'),desc:x.desc,amount:x.amount,date:x.date,cat:'',flags:[]}));
    if(mode==='replace')L.items=its;else its.forEach(i=>{if(!L.items.some(x=>sameRow(x,i,['desc','amount','date'])))L.items.push(i)});
    S.settings.extras=S.settings.extras.filter(x=>!/تجهيز موقع/.test(x.label));
  }
  if(p.mats){if(mode==='replace')S.subs.mats=p.mats;else p.mats.forEach(m=>{if(!S.subs.mats.some(x=>sameRow(x,m,['desc','amount','date'])))S.subs.mats.push(m)})}
}
function applyBoq(p,rm){
  p.divs.forEach(d=>{const i=S.boq.divs.findIndex(x=>x.id===d.id);if(i>=0)S.boq.divs[i]=d;else S.boq.divs.push(d)});
  if(rm&&rm.length)S.boq.divs=S.boq.divs.filter(d=>!rm.includes(d.id)||p.divs.some(x=>x.id===d.id));
  S.boq.divs.sort((a,b)=>a.id.localeCompare(b.id));
  if(p.codes&&p.codes.length)S.boq.codes=p.codes;
}
const monthSum=(list,f)=>{const o={};list.forEach(e=>{o[e.month]=o[e.month]||{n:0,t:0};o[e.month].n++;o[e.month].t+=(+f(e)||0)});return Object.keys(o).sort().map(m=>`${mLabel(m)}: ${o[m].n} بند (${fmt(o[m].t)})`).join('، ')};
function boqDiff(p){
  const lines=[];let same=0;const key=i=>cs(i.item)+'|'+cs(i.desc);
  p.divs.forEach(d=>{
    const e=S.boq.divs.find(x=>x.id===d.id);const nt=sum(d.items,i=>i.amount);
    if(!e){lines.push(`${d.title}: قسم جديد — ${d.items.length} بند (${fmt(nt)})`);return}
    const old=new Map();e.items.forEach(i=>{const k=key(i);if(!old.has(k))old.set(k,[]);old.get(k).push(i)});
    let add=0,chg=0,rem=0;
    d.items.forEach(i=>{const arr=old.get(key(i));if(arr&&arr.length){const o=arr.shift();if(+o.amount!==+i.amount||(o.qty??null)!==(i.qty??null)||(o.rate??null)!==(i.rate??null))chg++}else add++});
    old.forEach(a=>{rem+=a.length});
    const ot=sum(e.items,i=>i.amount);
    if(!add&&!rem&&!chg&&Math.abs(nt-ot)<0.0005){same++;return}
    lines.push(`${d.title}: +${add} بند، −${rem} بند، ${chg} متغيّر — الإجمالي من ${fmt(ot)} إلى ${fmt(nt)}`);
  });
  return{lines,same};
}
function buildPreview(sh,kinds){
  const P={},L=[];
  if(kinds.includes('monthly')){const m=P.monthly=parseMonthly(sh);
    L.push(['ملف المصروفات والمدخلات',[
      m.exp.length?'المصروفات — '+monthSum(m.exp,e=>e.actual):'',
      m.inc.length?'المدخلات — '+monthSum(m.inc,e=>e.amount):'',
      m.rec?`المطالبات: ${m.rec.length}`:'',m.pen?`مدخلات تحت التحصيل: ${m.pen.length}`:'',m.sal?`الرواتب: ${m.sal.rows.length} موظف`:''].filter(Boolean)])}
  if(kinds.includes('subs')){const q=P.subs=parseSubs(sh);
    L.push(['ملف حسابات المقاولين',[...q.subs.map(c=>`${c.trade}${c.name?' — '+c.name:''}: ${c.rows.length} مستخلص، المنفذ ${fmt(sum(c.rows,x=>x.executed))}${c.contract!=null?'، العقد '+fmt(c.contract):''}`),
      q.mats?`مواد البناء: ${q.mats.length} فاتورة (${fmt(sum(q.mats,x=>x.amount))})`:'',q.site?`تجهيز الموقع: ${q.siteN} بند (${fmt(sum(q.site,x=>x.amount))}) — بيتفتح كحساب فيه بنوده`:''].filter(Boolean)])}
  if(kinds.includes('boq')){const b=P.boq=parseBoq(sh);
    const df=boqDiff(b);
    L.push(['ملف BOQ',[`هيتطبّق على BOQ مشروع: ${projName(boqPid())}`,`${b.divs.length} قسم في الملف، ${sum(b.divs,d=>d.items.length)} بند، الإجمالي ${fmt(sum(b.divs,d=>sum(d.items,i=>i.amount)))}`,...df.lines,df.same?`${df.same} قسم بدون تغيير`:''].filter(Boolean)])}
  return{P,L};
}

/* ---------- built-in .xlsx reader (no external library needed) ---------- */
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined')throw new Error('المتصفح ده مش بيدعم قراءة xlsx. جرّب Chrome أو Safari حديث.');
  const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);
  let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('الملف مش xlsx صالح.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={method,csz,off};p+=46+nl+el+cl;
  }
  return{files,async get(name){
    const f=files[name];if(!f)return null;
    const lnl=dv.getUint16(f.off+26,true),lel=dv.getUint16(f.off+28,true),st=f.off+30+lnl+lel;
    const data=u.subarray(st,st+f.csz);
    return new TextDecoder().decode(f.method===0?data:await inflateRaw(data));
  }};
}
const colIdx=ref=>{let n=0;for(const ch of ref.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readXlsxOwn(buf){
  const z=await unzip(buf);const dp=new DOMParser();
  const X=async n=>{const t=await z.get(n);return t?dp.parseFromString(t,'application/xml'):null};
  const wbx=await X('xl/workbook.xml');if(!wbx)throw new Error('الملف مش xlsx صالح.');
  const rels=await X('xl/_rels/workbook.xml.rels');const rel={};
  if(rels)[...rels.getElementsByTagName('Relationship')].forEach(r=>{rel[r.getAttribute('Id')]=r.getAttribute('Target')});
  const ss=[];const sx=await X('xl/sharedStrings.xml');
  if(sx)[...sx.getElementsByTagName('si')].forEach(si=>{ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))});
  const out={};
  for(const sh of [...wbx.getElementsByTagName('sheet')]){
    const name=sh.getAttribute('name');let tg=rel[sh.getAttribute('r:id')]||'';
    const path=tg.startsWith('/')?tg.slice(1):'xl/'+tg;const doc=await X(path);if(!doc)continue;
    const rows=[];
    for(const row of doc.getElementsByTagName('row')){
      const r=+row.getAttribute('r')-1;const arr=rows[r]=[];
      for(const c of row.getElementsByTagName('c')){
        const ci=colIdx(c.getAttribute('r')||'A1');const t=c.getAttribute('t');let val=null;
        const v=c.getElementsByTagName('v')[0];
        if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
        else if(v){const tx=v.textContent;
          if(t==='s')val=ss[+tx]??null;else if(t==='str'||t==='e')val=tx;else if(t==='b')val=tx==='1';else if(tx!=='')val=parseFloat(tx)}
        if(val!==null&&val!=='')arr[ci]=val;
      }
    }
    let W=0;rows.forEach(r=>{if(r&&r.length>W)W=r.length});
    out[name]=Array.from({length:rows.length},(_,i)=>Array.from({length:W},(_,j)=>(rows[i]&&rows[i][j]!==undefined)?rows[i][j]:null));
  }
  return out;
}
async function loadSheets(f){
  const buf=await f.arrayBuffer();
  try{return await readXlsxOwn(buf)}
  catch(e){
    if(typeof XLSX!=='undefined'){try{return sheetsOf(XLSX.read(buf,{type:'array'}))}catch(e2){}}
    if(/\.xls$/i.test(f.name))throw new Error('صيغة xls القديمة مش مدعومة. افتح الملف واحفظه كـ xlsx وجرّب تاني.');

const DRV='Google Drive';let MCP=null,FILEARGS=false,CREATE='create_file';

function errMsg(e){const c=e&&e.code;

  if(c==='not_in_manifest'||c==='consent_required'||c==='approval_required')return 'لازم توافق على السماح للبرنامج بالرفع على Drive.';
  if(c==='blocked_by_policy')return 'الرفع على Drive ممنوع من إعدادات المؤسسة.';

const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function driveUpload(folder,title,mime,blob){

  if(FILEARGS)content={$file:{data:blob,name:title,type:mime}};
  else{if(blob.size>700*1024)throw{code:'tool_error',message:'الملف أكبر من الحد المسموح في هذا العرض.'};content=b64(await blob.arrayBuffer())}
  const r=await MCP.callTool(DRV,CREATE,{title,base64Content:content,contentMimeType:mime,disableConversionToGoogleType:true,parentId:folder});
  let d=r&&r.payload;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d=null}}

}

const cleanName=t=>String(t||'').replace(/[\\\/:*?"<>|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,40)||'إيصال';
function shrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(new Error('تعذر تجهيز الصورة')),'image/jpeg',0.82)};im.onerror=()=>rej(new Error('تعذر قراءة الصورة'));im.src=fr.result};
  fr.onerror=()=>rej(new Error('تعذر قراءة الملف'));fr.readAsDataURL(file)})}

let LOCKKEY=null;
const _enc=new TextEncoder(),_dec=new TextDecoder();
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(user,pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',_enc.encode(String(user).trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encStr(key,str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_enc.encode(str));return 'enc1:'+b64(iv)+':'+b64(ct)}
async function decStr(key,s){const p=s.split(':');return _dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[1])},key,b64d(p[2])))}
const lockMeta=()=>{try{return JSON.parse(localStorage.getItem('acct:lock')||'null')}catch(e){return null}};
async function makeMeta(user,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iter=200000;const key=await deriveKey(user,pass,salt,iter);
  return{key,meta:{u:String(user).trim().toLowerCase(),salt:b64(salt),iter,ver:await encStr(key,'acct-ok')}};
}
async function checkPass(meta,user,pass){
  try{const key=await deriveKey(user,pass,b64d(meta.salt),meta.iter);return(await decStr(key,meta.ver))==='acct-ok'?key:null}catch(e){return null}
}

      cb({exists:has,data:()=>data})}catch(e){if(err)err(e)}})();return()=>{}},
    async set(body){let raw=JSON.stringify(body);if(LOCKKEY)raw=await encStr(LOCKKEY,raw);localStorage.setItem(key,raw)}}}};
}
const LocalDL={async save({filename,data}){
  const ext=(filename.split('.').pop()||'').toLowerCase();
  const type={html:'text/html;charset=utf-8',json:'application/json',xlsx:XMIME}[ext]||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);return{};
}};
(async function init(){
  render();
  try{
    if(window.claude&&claude.use){
      const[db,dl,user]=await Promise.all([claude.use('db'),claude.use('downloads'),claude.use('user')]);
      DB=db;DL=dl;
      if(user){try{const w=await user.can('data.write');if(w===false)ro=true}catch(e){}}
      try{MCP=await claude.use('mcp');if(MCP){try{const lt=await MCP.listTools();FILEARGS=!!lt.fileArgs;const sv=(lt.servers||[]).find(x=>x.server===DRV);if(sv){const t=(sv.tools||[]).find(x=>/(^|_)create_file$/.test(x.name));if(t)CREATE=t.name}}catch(e){}}}catch(e){MCP=null}
    }
  }catch(e){}
  if(SERVER){await serverBoot()}else if(!DB&&STANDALONE){DB=makeLocalDB();DL=LocalDL;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
  if(STANDALONE&&!SERVER){const lm=lockMeta();if(lm){await showLock(lm)}}
  if(DB){subscribe()}else{mode='ready';stat='nodb';render()}
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
